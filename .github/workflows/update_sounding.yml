name: 🔄 自动更新探空图

on:
  schedule:
    - cron: '10 0,12 * * *'
  workflow_dispatch:

# ✅ 关键：授予写入仓库内容的权限
permissions:
  contents: write

jobs:
  update-sounding:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 获取数据并生成探空图
        run: python generate_sounding.py
        env:
          PYTHONUNBUFFERED: 1

      - name: 📊 检查图片
        run: |
          if [ -f "images/sounding_45004.png" ]; then
            echo "✅ 图片生成成功"
            ls -lh images/
          else
            echo "❌ 图片生成失败"
            exit 1
          fi

      - name: 💾 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/sounding_45004.png || true
          if git diff --staged --quiet; then
            echo "ℹ️ 没有变化，跳过提交"
          else
            git commit -m "🔄 自动更新探空图 [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
